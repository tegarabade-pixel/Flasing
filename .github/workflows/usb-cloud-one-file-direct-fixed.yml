name: Universal USB Cloud - Direct USBIP

on:
  workflow_dispatch:
    inputs:
      android_tailscale_ip:
        description: "IP Tailscale HP HOST Android (100.x.x.x)"
        required: true
      keep_alive_minutes:
        description: "Runner hidup berapa menit"
        required: true
        default: "120"

permissions:
  contents: read

jobs:
  usb-cloud:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validate input
        shell: pwsh
        run: |
          $ip = '${{ inputs.android_tailscale_ip }}'.Trim()

          if ($ip -notmatch '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {
            throw "Isi android_tailscale_ip dengan IP Tailscale HP host, contoh 100.118.152.23"
          }

          "ANDROID_TS_IP=$ip" |
            Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: usb-cloud-${{ github.run_id }}
          version: latest
          timeout: 3m
          retry: 3

      - name: Install usbip-win2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          Write-Host "========================================"
          Write-Host " USBIP-WIN2 INSTALL"
          Write-Host "========================================"

          # Use the Actions built-in token so the shared GitHub runner IP
          # does not hit the tiny unauthenticated REST API rate limit.
          $headers = @{
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent"    = "Universal-USB-Cloud"
          }

          Write-Host "Fetching latest usbip-win2 release with authenticated GitHub API..."

          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/vadimgrn/usbip-win2/releases/latest"

          Write-Host "Release: $($release.tag_name)"

          # Current release naming is like:
          # USBip-0.9.8.0-x64-Release.exe
          # PowerShell -match is case-insensitive by default.
          $asset = $release.assets |
            Where-Object {
              $_.name -match '^USBip-[0-9.]+-x64-release\.exe$'
            } |
            Select-Object -First 1

          if (-not $asset) {
            Write-Host ""
            Write-Host "Available release assets:"
            $release.assets |
              ForEach-Object { Write-Host " - $($_.name)" }

            throw "Installer USBip x64 Release tidak ditemukan."
          }

          Write-Host "Installer: $($asset.name)"

          $installer = Join-Path $env:RUNNER_TEMP $asset.name

          Invoke-WebRequest `
            -UseBasicParsing `
            -Headers @{
              "Authorization" = "Bearer $env:GH_TOKEN"
              "User-Agent" = "Universal-USB-Cloud"
            } `
            -Uri $asset.browser_download_url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "Installer gagal didownload."
          }

          $size = (Get-Item $installer).Length
          Write-Host "Downloaded: $([math]::Round($size / 1MB, 2)) MB"

          if ($size -lt 500KB) {
            throw "File installer terlalu kecil; download kemungkinan gagal."
          }

          Write-Host "Installing usbip-win2 silently..."

          $proc = Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" `
            -PassThru

          # Some old usbip-win2 installers were reported to remain open
          # after installation. Do not let an ephemeral Actions job hang forever.
          $deadline = (Get-Date).AddSeconds(120)

          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep 2
            $proc.Refresh()
          }

          if (-not $proc.HasExited) {
            Write-Warning "Installer masih hidup setelah 120 detik. Memverifikasi instalasi sebelum menghentikannya..."
          } else {
            Write-Host "Installer exit code: $($proc.ExitCode)"
          }

          # Find usbip.exe regardless of exact install directory.
          $candidates = @(
            "C:\Program Files\USBip\usbip.exe",
            "C:\Program Files (x86)\USBip\usbip.exe"
          )

          $usbip = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $usbip) {
            $found = Get-ChildItem `
              "C:\Program Files" `
              -Filter usbip.exe `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $usbip = $found.FullName
            }
          }

          if (-not $usbip) {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            throw "usbip.exe tidak ditemukan setelah instalasi."
          }

          if (-not $proc.HasExited) {
            Write-Warning "Instalasi sudah ada; menghentikan proses installer yang tertinggal."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          "USBIP_EXE=$usbip" |
            Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append

          Write-Host ""
          Write-Host "usbip.exe: $usbip"

          Write-Host "`nUSB/IP version/help:"
          & $usbip --version 2>&1 | Out-String | Write-Host

          Write-Host "`nUSB/IP related PnP devices:"
          Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FriendlyName -match "USBip|USB/IP" -or
              $_.InstanceId -match "USBIP_WIN2"
            } |
            Format-Table -AutoSize

      - name: Wait for Android USB-IP server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " ANDROID USB/IP SERVER"
          Write-Host "========================================"
          Write-Host "HP host : $env:ANDROID_TS_IP"
          Write-Host "Port    : 3240"
          Write-Host ""
          Write-Host "Di HP:"
          Write-Host "1. Tailscale ON"
          Write-Host "2. Buka Android-Usbipdcpp"
          Write-Host "3. Port 3240"
          Write-Host "4. Start Server"
          Write-Host "5. Colok flashdisk lewat OTG"
          Write-Host "6. Allow USB permission"
          Write-Host "7. Bind device"
          Write-Host "========================================"

          $deadline = (Get-Date).AddMinutes(10)
          $ok = $false

          while ((Get-Date) -lt $deadline) {
            try {
              $client = [System.Net.Sockets.TcpClient]::new()
              $task = $client.ConnectAsync($env:ANDROID_TS_IP, 3240)

              if ($task.Wait(3000) -and $client.Connected) {
                $client.Close()
                $ok = $true
                break
              }

              $client.Close()
            } catch {}

            Write-Host "Belum reachable... $(Get-Date -Format T)"
            Start-Sleep 5
          }

          if (-not $ok) {
            throw "Android USB/IP $env:ANDROID_TS_IP`:3240 tidak reachable selama 10 menit."
          }

          Write-Host "Android USB/IP server reachable: OK"

      - name: Verify remote USB list
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host " REMOTE USB DEVICE LIST"
          Write-Host "========================================"

          & "$env:USBIP_EXE" list -r "$env:ANDROID_TS_IP"

          Write-Host ""
          Write-Host "Kalau belum ada device, pastikan device di Android-Usbipdcpp sudah di-Bind."

      - name: Auto attach and keep runner alive
        shell: pwsh
        env:
          KEEP: ${{ inputs.keep_alive_minutes }}
        run: |
          $ErrorActionPreference = "Continue"

          $end = (Get-Date).AddMinutes([int]$env:KEEP)
          $attached = @{}

          Write-Host "========================================"
          Write-Host " UNIVERSAL USB AUTO-ATTACH ACTIVE"
          Write-Host " Android: $env:ANDROID_TS_IP`:3240"
          Write-Host "========================================"

          while ((Get-Date) -lt $end) {

            $output = (
              & "$env:USBIP_EXE" list -r "$env:ANDROID_TS_IP" 2>&1 |
              Out-String
            )

            Write-Host "`n--- Remote USB/IP list $(Get-Date -Format T) ---"
            Write-Host $output.Trim()

            # Typical USB/IP bus IDs: 1-1, 2-3.4, etc.
            $busIds = [regex]::Matches(
              $output,
              '(?m)^\s*([0-9]+-[0-9]+(?:\.[0-9]+)*):'
            ) |
              ForEach-Object { $_.Groups[1].Value } |
              Select-Object -Unique

            foreach ($bus in $busIds) {
              if (-not $attached.ContainsKey($bus)) {
                Write-Host "Attaching busid $bus ..."

                $result = (
                  & "$env:USBIP_EXE" attach `
                    -r "$env:ANDROID_TS_IP" `
                    -b "$bus" `
                    --receive-mode=low-latency `
                    2>&1 |
                  Out-String
                )

                Write-Host $result.Trim()

                if ($result -match "successfully attached") {
                  $attached[$bus] = $true
                }
              }
            }

            Write-Host "`n--- Windows USB/PnP ---"
            Get-PnpDevice -PresentOnly -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Class -match "USB|DiskDrive|HIDClass|Ports|AndroidUsbDeviceClass"
              } |
              Sort-Object Class,FriendlyName |
              Select-Object Status,Class,FriendlyName |
              Format-Table -AutoSize

            Write-Host "`n--- Disks ---"
            Get-Disk -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

            Write-Host "`n--- Volumes ---"
            Get-Volume -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

            Start-Sleep 5
          }
