name: Universal USB Cloud - ONE FILE

on:
  workflow_dispatch:
    inputs:
      deploy_signaling:
        description: "Deploy Cloudflare signaling sekarang?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Setup Node
        if: ${{ inputs.deploy_signaling }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate project dari SATU workflow
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/universal-usb-cloud"
          rm -rf "$ROOT"
          mkdir -p \
            "$ROOT/android/app/src/main/java/com/universalusb/cloud" \
            "$ROOT/android/app/src/main" \
            "$ROOT/agent" \
            "$ROOT/signaling/src" \
            "$ROOT/dist"

          cat > "$ROOT/android/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "UniversalUsbCloud"
          include(":app")
          EOF

          cat > "$ROOT/android/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > "$ROOT/android/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > "$ROOT/android/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.universalusb.cloud'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.universalusb.cloud'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'io.github.webrtc-sdk:android:144.7559.09'
          }
          EOF

          cat > "$ROOT/android/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Universal USB Cloud"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$ROOT/android/app/src/main/java/com/universalusb/cloud/MainActivity.java" <<'EOF'
          package com.universalusb.cloud;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.webrtc.DataChannel;
          import org.webrtc.IceCandidate;
          import org.webrtc.MediaConstraints;
          import org.webrtc.MediaStream;
          import org.webrtc.PeerConnection;
          import org.webrtc.PeerConnectionFactory;
          import org.webrtc.RtpReceiver;
          import org.webrtc.SdpObserver;
          import org.webrtc.SessionDescription;

          import java.nio.ByteBuffer;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.TimeUnit;

          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;

          public class MainActivity extends Activity {
              private static final String USB_PERMISSION =
                      "com.universalusb.cloud.USB_PERMISSION";

              private UsbManager usbManager;
              private TextView status;
              private TextView log;
              private EditText signalUrl;
              private EditText room;
              private ListView usbList;

              private final List<UsbDevice> devices = new ArrayList<>();
              private UsbDevice selected;

              private final OkHttpClient http = new OkHttpClient.Builder()
                      .pingInterval(20, TimeUnit.SECONDS)
                      .build();

              private WebSocket ws;
              private PeerConnectionFactory factory;
              private PeerConnection peer;
              private DataChannel dc;

              private final List<IceCandidate> pendingCandidates = new ArrayList<>();
              private boolean remoteDescriptionSet = false;
              private boolean offerInFlight = false;

              private final BroadcastReceiver usbReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      String action = intent.getAction();

                      if (USB_PERMISSION.equals(action)) {
                          UsbDevice d = getUsbExtra(intent);
                          boolean granted = intent.getBooleanExtra(
                                  UsbManager.EXTRA_PERMISSION_GRANTED, false);

                          append("USB permission: " + granted);

                          if (granted && d != null) {
                              selected = d;
                              sendUsbDescriptor(d);
                          }
                          return;
                      }

                      if (UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(action)) {
                          append("USB attached");
                          refreshUsb();
                          return;
                      }

                      if (UsbManager.ACTION_USB_DEVICE_DETACHED.equals(action)) {
                          UsbDevice d = getUsbExtra(intent);
                          append("USB detached: " + (d == null ? "unknown" : d.getDeviceName()));

                          JSONObject obj = new JSONObject();
                          try {
                              obj.put("type", "usb-detach");
                              obj.put("deviceName", d == null ? "" : d.getDeviceName());
                              sendJson(obj);
                          } catch (Exception ignored) {}

                          refreshUsb();
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  usbManager = (UsbManager) getSystemService(USB_SERVICE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(14);
                  root.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("Universal USB Cloud v0.1");
                  title.setTextSize(22f);
                  root.addView(title);

                  status = new TextView(this);
                  status.setText("P2P: disconnected");
                  root.addView(status);

                  signalUrl = new EditText(this);
                  signalUrl.setHint("wss://nama-worker.workers.dev/ws");
                  signalUrl.setSingleLine(true);
                  root.addView(signalUrl);

                  room = new EditText(this);
                  room.setHint("Room code");
                  room.setSingleLine(true);
                  room.setText(UUID.randomUUID().toString().replace("-", "").substring(0, 24));
                  root.addView(room);

                  Button connect = new Button(this);
                  connect.setText("CONNECT P2P");
                  connect.setOnClickListener(v -> connectP2P());
                  root.addView(connect);

                  Button scan = new Button(this);
                  scan.setText("SCAN USB OTG");
                  scan.setOnClickListener(v -> refreshUsb());
                  root.addView(scan);

                  usbList = new ListView(this);
                  usbList.setMinimumHeight(dp(220));
                  usbList.setOnItemClickListener((parent, view, position, id) -> {
                      selected = devices.get(position);
                      refreshUsbAdapter();
                      append("Selected: " + selected.getDeviceName());
                  });
                  root.addView(usbList,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT, dp(240)));

                  Button send = new Button(this);
                  send.setText("ALLOW + SEND USB INFO");
                  send.setOnClickListener(v -> {
                      if (selected == null) {
                          toast("Pilih USB device dulu");
                      } else {
                          allowAndSend(selected);
                      }
                  });
                  root.addView(send);

                  log = new TextView(this);
                  log.setTextIsSelectable(true);
                  root.addView(log);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(USB_PERMISSION);
                  filter.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED);
                  filter.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(usbReceiver, filter, Context.RECEIVER_EXPORTED);
                  } else {
                      registerReceiver(usbReceiver, filter);
                  }

                  initWebRtc();
                  refreshUsb();
              }

              private int dp(int x) {
                  return (int) (x * getResources().getDisplayMetrics().density);
              }

              @SuppressWarnings("deprecation")
              private UsbDevice getUsbExtra(Intent intent) {
                  if (Build.VERSION.SDK_INT >= 33) {
                      return intent.getParcelableExtra(
                              UsbManager.EXTRA_DEVICE, UsbDevice.class);
                  }
                  return intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);
              }

              private void initWebRtc() {
                  PeerConnectionFactory.initialize(
                          PeerConnectionFactory.InitializationOptions
                                  .builder(this)
                                  .createInitializationOptions());

                  factory = PeerConnectionFactory.builder()
                          .createPeerConnectionFactory();

                  append("WebRTC initialized");
              }

              private void connectP2P() {
                  closePeer();

                  String base = signalUrl.getText().toString().trim();
                  String roomCode = room.getText().toString().trim();

                  if (base.isEmpty() || roomCode.length() < 12) {
                      toast("Isi Signal URL + room minimal 12 karakter");
                      return;
                  }

                  if (base.startsWith("https://")) {
                      base = "wss://" + base.substring(8);
                  } else if (base.startsWith("http://")) {
                      base = "ws://" + base.substring(7);
                  }

                  if (!base.startsWith("ws://") && !base.startsWith("wss://")) {
                      toast("Signal URL harus ws:// atau wss://");
                      return;
                  }

                  if (!base.contains("/ws")) {
                      if (base.endsWith("/")) base = base.substring(0, base.length() - 1);
                      base += "/ws";
                  }

                  List<PeerConnection.IceServer> ice = Collections.singletonList(
                          PeerConnection.IceServer
                                  .builder("stun:stun.cloudflare.com:3478")
                                  .createIceServer());

                  PeerConnection.RTCConfiguration cfg =
                          new PeerConnection.RTCConfiguration(ice);

                  peer = factory.createPeerConnection(cfg, new PeerConnection.Observer() {
                      @Override
                      public void onSignalingChange(PeerConnection.SignalingState state) {}

                      @Override
                      public void onIceConnectionChange(PeerConnection.IceConnectionState state) {
                          setStatus("ICE: " + state);
                          append("ICE: " + state);
                      }

                      @Override
                      public void onIceConnectionReceivingChange(boolean receiving) {}

                      @Override
                      public void onIceGatheringChange(PeerConnection.IceGatheringState state) {
                          append("ICE gathering: " + state);
                      }

                      @Override
                      public void onIceCandidate(IceCandidate c) {
                          if (c == null) return;
                          try {
                              JSONObject o = new JSONObject();
                              o.put("type", "candidate");
                              o.put("candidate", c.sdp);
                              o.put("sdpMid", c.sdpMid == null ? "" : c.sdpMid);
                              o.put("sdpMLineIndex", c.sdpMLineIndex);
                              sendSignal(o);
                          } catch (Exception e) {
                              append("candidate error: " + e.getMessage());
                          }
                      }

                      @Override
                      public void onIceCandidatesRemoved(IceCandidate[] candidates) {}

                      @Override
                      public void onAddStream(MediaStream stream) {}

                      @Override
                      public void onRemoveStream(MediaStream stream) {}

                      @Override
                      public void onDataChannel(DataChannel dataChannel) {}

                      @Override
                      public void onRenegotiationNeeded() {}

                      @Override
                      public void onAddTrack(RtpReceiver receiver, MediaStream[] mediaStreams) {}
                  });

                  if (peer == null) {
                      toast("Gagal membuat PeerConnection");
                      return;
                  }

                  DataChannel.Init init = new DataChannel.Init();
                  init.ordered = true;

                  dc = peer.createDataChannel("usb", init);

                  dc.registerObserver(new DataChannel.Observer() {
                      @Override
                      public void onBufferedAmountChange(long previousAmount) {}

                      @Override
                      public void onStateChange() {
                          DataChannel.State s = dc.state();
                          append("DataChannel: " + s);
                          if (s == DataChannel.State.OPEN) {
                              setStatus("P2P: CONNECTED | DataChannel: OPEN");
                              try {
                                  JSONObject hello = new JSONObject();
                                  hello.put("type", "android-ready");
                                  hello.put("model", Build.MODEL);
                                  hello.put("sdk", Build.VERSION.SDK_INT);
                                  sendJson(hello);
                              } catch (Exception ignored) {}
                          }
                      }

                      @Override
                      public void onMessage(DataChannel.Buffer buffer) {
                          ByteBuffer b = buffer.data;
                          byte[] data = new byte[b.remaining()];
                          b.get(data);
                          if (buffer.binary) {
                              append("Windows binary: " + data.length + " bytes");
                          } else {
                              append("Windows: " +
                                      new String(data, StandardCharsets.UTF_8));
                          }
                      }
                  });

                  String finalBase = base;
                  Request request = new Request.Builder()
                          .url(finalBase + "?room=" + roomCode + "&role=android")
                          .build();

                  ws = http.newWebSocket(request, new WebSocketListener() {
                      @Override
                      public void onOpen(WebSocket webSocket, Response response) {
                          append("Signaling connected");
                      }

                      @Override
                      public void onMessage(WebSocket webSocket, String text) {
                          handleSignal(text);
                      }

                      @Override
                      public void onFailure(
                              WebSocket webSocket,
                              Throwable t,
                              Response response) {
                          append("Signaling error: " + t.getMessage());
                      }

                      @Override
                      public void onClosed(
                              WebSocket webSocket,
                              int code,
                              String reason) {
                          append("Signaling closed: " + code + " " + reason);
                      }
                  });
              }

              private void maybeOffer() {
                  if (offerInFlight || peer == null) return;
                  offerInFlight = true;

                  peer.createOffer(new SimpleSdpObserver() {
                      @Override
                      public void onCreateSuccess(SessionDescription desc) {
                          peer.setLocalDescription(new SimpleSdpObserver() {
                              @Override
                              public void onSetSuccess() {
                                  try {
                                      JSONObject o = new JSONObject();
                                      o.put("type", "offer");
                                      o.put("sdp", desc.description);
                                      sendSignal(o);
                                  } catch (Exception e) {
                                      append("offer send error: " + e.getMessage());
                                  }
                              }
                          }, desc);
                      }

                      @Override
                      public void onCreateFailure(String error) {
                          offerInFlight = false;
                          append("CreateOffer failed: " + error);
                      }
                  }, new MediaConstraints());
              }

              private void handleSignal(String text) {
                  try {
                      JSONObject obj = new JSONObject(text);
                      String type = obj.optString("type");

                      if ("signal-ready".equals(type)) {
                          append("Signal ready");
                          if (obj.optInt("peers", 0) >= 2) maybeOffer();
                          return;
                      }

                      if ("peer-joined".equals(type)) {
                          append("Peer joined: " + obj.optString("role"));
                          if ("windows".equals(obj.optString("role"))) maybeOffer();
                          return;
                      }

                      if ("peer-left".equals(type)) {
                          append("Peer left: " + obj.optString("role"));
                          return;
                      }

                      if ("answer".equals(type)) {
                          SessionDescription answer = new SessionDescription(
                                  SessionDescription.Type.ANSWER,
                                  obj.getString("sdp"));

                          peer.setRemoteDescription(new SimpleSdpObserver() {
                              @Override
                              public void onSetSuccess() {
                                  remoteDescriptionSet = true;
                                  synchronized (pendingCandidates) {
                                      for (IceCandidate c : pendingCandidates) {
                                          peer.addIceCandidate(c);
                                      }
                                      pendingCandidates.clear();
                                  }
                                  append("Remote answer set");
                              }
                          }, answer);
                          return;
                      }

                      if ("candidate".equals(type)) {
                          String mid = obj.optString("sdpMid", "");
                          IceCandidate c = new IceCandidate(
                                  mid.isEmpty() ? null : mid,
                                  obj.optInt("sdpMLineIndex", 0),
                                  obj.getString("candidate"));

                          if (remoteDescriptionSet) {
                              peer.addIceCandidate(c);
                          } else {
                              synchronized (pendingCandidates) {
                                  pendingCandidates.add(c);
                              }
                          }
                      }
                  } catch (Exception e) {
                      append("Signal parse error: " + e.getMessage());
                  }
              }

              private void sendSignal(JSONObject o) {
                  WebSocket socket = ws;
                  if (socket != null) socket.send(o.toString());
              }

              private void sendJson(JSONObject o) {
                  DataChannel channel = dc;
                  if (channel == null || channel.state() != DataChannel.State.OPEN) {
                      append("DataChannel belum OPEN");
                      return;
                  }

                  byte[] bytes = o.toString().getBytes(StandardCharsets.UTF_8);
                  channel.send(new DataChannel.Buffer(
                          ByteBuffer.wrap(bytes), false));
              }

              private void refreshUsb() {
                  devices.clear();

                  Map<String, UsbDevice> map = usbManager.getDeviceList();
                  devices.addAll(map.values());
                  devices.sort(Comparator.comparing(UsbDevice::getDeviceName));

                  if (selected != null) {
                      boolean stillExists = false;
                      for (UsbDevice d : devices) {
                          if (d.getDeviceName().equals(selected.getDeviceName())) {
                              stillExists = true;
                              break;
                          }
                      }
                      if (!stillExists) selected = null;
                  }

                  refreshUsbAdapter();
                  append("USB devices: " + devices.size());
              }

              private void refreshUsbAdapter() {
                  List<String> rows = new ArrayList<>();

                  for (UsbDevice d : devices) {
                      String product;
                      try {
                          product = d.getProductName();
                      } catch (Exception e) {
                          product = null;
                      }

                      String mark = selected != null &&
                              selected.getDeviceName().equals(d.getDeviceName())
                              ? "✓ " : "";

                      rows.add(mark +
                              (product == null ? "USB Device" : product) +
                              "\nVID:" + String.format("%04X", d.getVendorId()) +
                              " PID:" + String.format("%04X", d.getProductId()) +
                              " class:" + d.getDeviceClass() +
                              " ifaces:" + d.getInterfaceCount());
                  }

                  usbList.setAdapter(new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_list_item_1,
                          rows));
              }

              private void allowAndSend(UsbDevice d) {
                  if (usbManager.hasPermission(d)) {
                      sendUsbDescriptor(d);
                      return;
                  }

                  Intent i = new Intent(USB_PERMISSION);
                  i.setPackage(getPackageName());

                  int flags = 0;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      flags |= PendingIntent.FLAG_MUTABLE;
                  }

                  PendingIntent pi = PendingIntent.getBroadcast(
                          this, 1001, i, flags);

                  usbManager.requestPermission(d, pi);
              }

              private void sendUsbDescriptor(UsbDevice d) {
                  try {
                      JSONArray interfaces = new JSONArray();

                      for (int i = 0; i < d.getInterfaceCount(); i++) {
                          UsbInterface iface = d.getInterface(i);
                          JSONArray endpoints = new JSONArray();

                          for (int e = 0; e < iface.getEndpointCount(); e++) {
                              UsbEndpoint ep = iface.getEndpoint(e);

                              JSONObject eo = new JSONObject();
                              eo.put("address", ep.getAddress());
                              eo.put("direction", ep.getDirection());
                              eo.put("type", ep.getType());
                              eo.put("maxPacketSize", ep.getMaxPacketSize());
                              eo.put("interval", ep.getInterval());
                              endpoints.put(eo);
                          }

                          JSONObject io = new JSONObject();
                          io.put("id", iface.getId());
                          io.put("alternateSetting", iface.getAlternateSetting());
                          io.put("class", iface.getInterfaceClass());
                          io.put("subclass", iface.getInterfaceSubclass());
                          io.put("protocol", iface.getInterfaceProtocol());
                          io.put("endpoints", endpoints);
                          interfaces.put(io);
                      }

                      JSONObject obj = new JSONObject();
                      obj.put("type", "usb-device");
                      obj.put("deviceName", d.getDeviceName());
                      obj.put("vendorId", d.getVendorId());
                      obj.put("productId", d.getProductId());
                      obj.put("deviceClass", d.getDeviceClass());
                      obj.put("deviceSubclass", d.getDeviceSubclass());
                      obj.put("deviceProtocol", d.getDeviceProtocol());
                      obj.put("interfaceCount", d.getInterfaceCount());
                      obj.put("interfaces", interfaces);

                      try {
                          obj.put("manufacturer",
                                  d.getManufacturerName() == null ? "" : d.getManufacturerName());
                          obj.put("product",
                                  d.getProductName() == null ? "" : d.getProductName());
                          obj.put("version",
                                  d.getVersion() == null ? "" : d.getVersion());

                          if (usbManager.hasPermission(d)) {
                              obj.put("serial",
                                      d.getSerialNumber() == null ? "" : d.getSerialNumber());
                          }
                      } catch (Exception ignored) {}

                      sendJson(obj);
                      append("USB info sent: " +
                              String.format("%04X:%04X",
                                      d.getVendorId(), d.getProductId()));

                  } catch (Exception e) {
                      append("USB descriptor error: " + e.getMessage());
                  }
              }

              private void setStatus(String s) {
                  runOnUiThread(() -> status.setText(s));
              }

              private void append(String s) {
                  runOnUiThread(() -> {
                      String all = log.getText().toString() + "\n" + s;
                      if (all.length() > 14000) {
                          all = all.substring(all.length() - 14000);
                      }
                      log.setText(all);
                  });
              }

              private void toast(String s) {
                  runOnUiThread(() ->
                          Toast.makeText(this, s, Toast.LENGTH_SHORT).show());
              }

              private void closePeer() {
                  try { if (dc != null) dc.close(); } catch (Exception ignored) {}
                  try { if (peer != null) peer.close(); } catch (Exception ignored) {}
                  try { if (ws != null) ws.close(1000, "reconnect"); } catch (Exception ignored) {}

                  dc = null;
                  peer = null;
                  ws = null;
                  remoteDescriptionSet = false;
                  offerInFlight = false;

                  synchronized (pendingCandidates) {
                      pendingCandidates.clear();
                  }
              }

              @Override
              protected void onDestroy() {
                  closePeer();
                  try { unregisterReceiver(usbReceiver); } catch (Exception ignored) {}
                  if (factory != null) factory.dispose();
                  super.onDestroy();
              }

              private static class SimpleSdpObserver implements SdpObserver {
                  @Override
                  public void onCreateSuccess(SessionDescription desc) {}

                  @Override
                  public void onSetSuccess() {}

                  @Override
                  public void onCreateFailure(String error) {}

                  @Override
                  public void onSetFailure(String error) {}
              }
          }
          EOF

          cat > "$ROOT/agent/go.mod" <<'EOF'
          module universal-usb-cloud/agent

          go 1.23

          require (
              github.com/gorilla/websocket v1.5.3
              github.com/pion/webrtc/v4 v4.2.18
          )
          EOF

          cat > "$ROOT/agent/main.go" <<'EOF'
          package main

          import (
              "encoding/json"
              "flag"
              "fmt"
              "log"
              "net/url"
              "os"
              "os/signal"
              "strings"
              "sync"
              "syscall"
              "time"

              "github.com/gorilla/websocket"
              "github.com/pion/webrtc/v4"
          )

          type Signal struct {
              Type          string  `json:"type"`
              SDP           string  `json:"sdp,omitempty"`
              Candidate     string  `json:"candidate,omitempty"`
              SDPMid        *string `json:"sdpMid,omitempty"`
              SDPMLineIndex *uint16 `json:"sdpMLineIndex,omitempty"`
          }

          type SafeWS struct {
              c  *websocket.Conn
              mu sync.Mutex
          }

          func (s *SafeWS) send(v any) error {
              s.mu.Lock()
              defer s.mu.Unlock()
              return s.c.WriteJSON(v)
          }

          func makeSignalURL(base, room string) (string, error) {
              u, err := url.Parse(base)
              if err != nil {
                  return "", err
              }

              switch u.Scheme {
              case "https":
                  u.Scheme = "wss"
              case "http":
                  u.Scheme = "ws"
              case "ws", "wss":
              default:
                  return "", fmt.Errorf("signal URL harus ws/wss/http/https")
              }

              if u.Path == "" || u.Path == "/" {
                  u.Path = "/ws"
              }

              q := u.Query()
              q.Set("room", room)
              q.Set("role", "windows")
              u.RawQuery = q.Encode()
              return u.String(), nil
          }

          func main() {
              signalBase := flag.String(
                  "signal", "", "wss://worker.workers.dev/ws")
              room := flag.String(
                  "room", "", "room code yang sama dengan APK")
              flag.Parse()

              if *signalBase == "" || len(*room) < 12 {
                  flag.Usage()
                  os.Exit(2)
              }

              wsURL, err := makeSignalURL(*signalBase, *room)
              if err != nil {
                  log.Fatal(err)
              }

              log.Printf("Signaling: %s", wsURL)

              rawWS, _, err := websocket.DefaultDialer.Dial(wsURL, nil)
              if err != nil {
                  log.Fatalf("signaling connect: %v", err)
              }
              defer rawWS.Close()

              ws := &SafeWS{c: rawWS}

              pc, err := webrtc.NewPeerConnection(webrtc.Configuration{
                  ICEServers: []webrtc.ICEServer{
                      {URLs: []string{"stun:stun.cloudflare.com:3478"}},
                  },
              })
              if err != nil {
                  log.Fatal(err)
              }
              defer pc.Close()

              var remoteSet bool
              var pending []webrtc.ICECandidateInit
              var pendingMu sync.Mutex

              pc.OnICEConnectionStateChange(func(state webrtc.ICEConnectionState) {
                  log.Printf("ICE: %s", state.String())
              })

              pc.OnConnectionStateChange(func(state webrtc.PeerConnectionState) {
                  log.Printf("PeerConnection: %s", state.String())
              })

              pc.OnICECandidate(func(c *webrtc.ICECandidate) {
                  if c == nil {
                      return
                  }

                  init := c.ToJSON()

                  _ = ws.send(Signal{
                      Type:          "candidate",
                      Candidate:     init.Candidate,
                      SDPMid:        init.SDPMid,
                      SDPMLineIndex: init.SDPMLineIndex,
                  })
              })

              pc.OnDataChannel(func(dc *webrtc.DataChannel) {
                  log.Printf("DataChannel announced: %q", dc.Label())

                  dc.OnOpen(func() {
                      log.Printf("DataChannel %q OPEN", dc.Label())

                      hello, _ := json.Marshal(map[string]any{
                          "type": "windows-ready",
                          "time": time.Now().UTC().Format(time.RFC3339Nano),
                      })

                      _ = dc.SendText(string(hello))
                  })

                  dc.OnMessage(func(msg webrtc.DataChannelMessage) {
                      if !msg.IsString {
                          log.Printf("binary frame: %d bytes", len(msg.Data))
                          return
                      }

                      var obj map[string]any
                      if err := json.Unmarshal(msg.Data, &obj); err != nil {
                          log.Printf("text: %s", string(msg.Data))
                          return
                      }

                      if obj["type"] == "usb-device" {
                          pretty, _ := json.MarshalIndent(obj, "", "  ")
                          log.Printf("USB DEVICE FROM ANDROID:\n%s", pretty)
                          return
                      }

                      log.Printf("message: %s", string(msg.Data))
                  })
              })

              go func() {
                  for {
                      _, raw, err := rawWS.ReadMessage()
                      if err != nil {
                          log.Printf("signaling read ended: %v", err)
                          return
                      }

                      var generic map[string]any
                      if json.Unmarshal(raw, &generic) == nil {
                          t, _ := generic["type"].(string)

                          if t == "signal-ready" ||
                              t == "peer-joined" ||
                              t == "peer-left" {
                              log.Printf("signal event: %s",
                                  strings.TrimSpace(string(raw)))
                              continue
                          }
                      }

                      var sig Signal
                      if err := json.Unmarshal(raw, &sig); err != nil {
                          log.Printf("bad signal: %v", err)
                          continue
                      }

                      switch sig.Type {
                      case "offer":
                          log.Printf("received offer")

                          if err := pc.SetRemoteDescription(
                              webrtc.SessionDescription{
                                  Type: webrtc.SDPTypeOffer,
                                  SDP:  sig.SDP,
                              }); err != nil {
                              log.Printf("SetRemoteDescription: %v", err)
                              continue
                          }

                          pendingMu.Lock()
                          remoteSet = true

                          for _, c := range pending {
                              if err := pc.AddICECandidate(c); err != nil {
                                  log.Printf("add buffered candidate: %v", err)
                              }
                          }

                          pending = nil
                          pendingMu.Unlock()

                          answer, err := pc.CreateAnswer(nil)
                          if err != nil {
                              log.Printf("CreateAnswer: %v", err)
                              continue
                          }

                          if err := pc.SetLocalDescription(answer); err != nil {
                              log.Printf("SetLocalDescription: %v", err)
                              continue
                          }

                          if err := ws.send(Signal{
                              Type: "answer",
                              SDP: answer.SDP,
                          }); err != nil {
                              log.Printf("send answer: %v", err)
                          }

                      case "candidate":
                          init := webrtc.ICECandidateInit{
                              Candidate:     sig.Candidate,
                              SDPMid:        sig.SDPMid,
                              SDPMLineIndex: sig.SDPMLineIndex,
                          }

                          pendingMu.Lock()

                          if !remoteSet {
                              pending = append(pending, init)
                              pendingMu.Unlock()
                              continue
                          }

                          pendingMu.Unlock()

                          if err := pc.AddICECandidate(init); err != nil {
                              log.Printf("AddICECandidate: %v", err)
                          }
                      }
                  }
              }()

              log.Println("Windows agent ready; waiting Android offer.")

              stop := make(chan os.Signal, 1)
              signal.Notify(stop, syscall.SIGINT, syscall.SIGTERM)
              <-stop
          }
          EOF

          cat > "$ROOT/signaling/wrangler.toml" <<'EOF'
          name = "universal-usb-signal"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          workers_dev = true

          [[durable_objects.bindings]]
          name = "ROOMS"
          class_name = "SignalRoom"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["SignalRoom"]
          EOF

          cat > "$ROOT/signaling/src/index.js" <<'EOF'
          import { DurableObject } from "cloudflare:workers";

          function validRoom(room) {
            return typeof room === "string" &&
              /^[A-Za-z0-9_-]{12,80}$/.test(room);
          }

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);

              if (url.pathname === "/health") {
                return Response.json({
                  ok: true,
                  service: "universal-usb-signal"
                });
              }

              if (url.pathname !== "/ws") {
                return new Response(
                  "Universal USB Cloud signaling",
                  { status: 200 }
                );
              }

              if (
                request.headers.get("Upgrade")?.toLowerCase()
                !== "websocket"
              ) {
                return new Response(
                  "WebSocket required",
                  { status: 426 }
                );
              }

              const room = url.searchParams.get("room");
              const role = url.searchParams.get("role");

              if (!validRoom(room)) {
                return new Response(
                  "Invalid room",
                  { status: 400 }
                );
              }

              if (role !== "android" && role !== "windows") {
                return new Response(
                  "Invalid role",
                  { status: 400 }
                );
              }

              const id = env.ROOMS.idFromName(room);
              const stub = env.ROOMS.get(id);

              const forwarded = new Request(request);
              forwarded.headers.set("X-Usb-Role", role);

              return stub.fetch(forwarded);
            }
          };

          export class SignalRoom extends DurableObject {
            constructor(ctx, env) {
              super(ctx, env);
              this.ctx = ctx;
            }

            async fetch(request) {
              if (
                request.headers.get("Upgrade")?.toLowerCase()
                !== "websocket"
              ) {
                return new Response(
                  "WebSocket required",
                  { status: 426 }
                );
              }

              const role = request.headers.get("X-Usb-Role");

              if (role !== "android" && role !== "windows") {
                return new Response(
                  "Invalid role",
                  { status: 400 }
                );
              }

              for (const old of this.ctx.getWebSockets()) {
                const info = old.deserializeAttachment();

                if (info?.role === role) {
                  try {
                    old.close(
                      4001,
                      "replaced by newer peer"
                    );
                  } catch {}
                }
              }

              const pair = new WebSocketPair();
              const client = pair[0];
              const server = pair[1];

              server.serializeAttachment({ role });
              this.ctx.acceptWebSocket(server);

              server.send(JSON.stringify({
                type: "signal-ready",
                role,
                peers: this.ctx.getWebSockets().length
              }));

              for (const ws of this.ctx.getWebSockets()) {
                if (
                  ws !== server &&
                  ws.readyState === WebSocket.OPEN
                ) {
                  ws.send(JSON.stringify({
                    type: "peer-joined",
                    role
                  }));
                }
              }

              return new Response(
                null,
                { status: 101, webSocket: client }
              );
            }

            async webSocketMessage(ws, message) {
              const size =
                typeof message === "string"
                  ? message.length
                  : message.byteLength;

              if (size > 256 * 1024) {
                ws.close(
                  1009,
                  "signal too large"
                );
                return;
              }

              const sender =
                ws.deserializeAttachment()?.role
                ?? "unknown";

              for (const peer of this.ctx.getWebSockets()) {
                if (
                  peer === ws ||
                  peer.readyState !== WebSocket.OPEN
                ) continue;

                const receiver =
                  peer.deserializeAttachment()?.role;

                if (receiver === sender) continue;

                peer.send(message);
              }
            }

            async webSocketClose(ws) {
              const role =
                ws.deserializeAttachment()?.role
                ?? "unknown";

              for (const peer of this.ctx.getWebSockets()) {
                if (
                  peer !== ws &&
                  peer.readyState === WebSocket.OPEN
                ) {
                  peer.send(JSON.stringify({
                    type: "peer-left",
                    role
                  }));
                }
              }
            }
          }
          EOF

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            -p "$ROOT/android" \
            :app:assembleDebug \
            --stacktrace

          cp \
            "$ROOT/android/app/build/outputs/apk/debug/app-debug.apk" \
            "$ROOT/dist/UniversalUsbCloud-debug.apk"

      - name: Build Windows Agent
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT/agent"
          go mod tidy

          GOOS=windows \
          GOARCH=amd64 \
          CGO_ENABLED=0 \
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "$ROOT/dist/usb-cloud-agent.exe" .

      - name: Deploy Cloudflare signaling
        if: ${{ inputs.deploy_signaling }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          cd "$ROOT/signaling"

          npx --yes wrangler@4 deploy

          echo ""
          echo "Sesudah deploy, pakai endpoint:"
          echo "wss://NAMA-WORKER.SUBDOMAIN.workers.dev/ws"

      - name: Upload APK + Windows Agent
        uses: actions/upload-artifact@v4
        with:
          name: Universal-USB-Cloud-v0.1
          path: |
            ${{ env.ROOT }}/dist/UniversalUsbCloud-debug.apk
            ${{ env.ROOT }}/dist/usb-cloud-agent.exe
          if-no-files-found: error
